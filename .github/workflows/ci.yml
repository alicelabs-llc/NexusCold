name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke import test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from enricher_core import EnrichedCompany, run_enrichment
          from email_warmer import *
          print('OK: all modules import')
          c = EnrichedCompany(company_name='Smoke Test')
          assert c.company_name == 'Smoke Test'
          assert run_enrichment([]) == []
          print('OK: EnrichedCompany + run_enrichment work')
          "
