name: Prospect website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r website/requirements-build.txt
      - run: node --test website/tests/*.test.mjs
      - run: python -m unittest discover -s website/tests -p 'test_*.py'
      - run: python website/build.py
      - run: python website/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: techdigital-prospect-static
          path: website/dist/prospect/
          include-hidden-files: true
          retention-days: 14
