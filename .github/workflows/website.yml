name: Prospect website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r website/requirements-build.txt
      - run: node --test website/tests/*.test.mjs
      - run: python website/build.py
      - run: python website/check.py
