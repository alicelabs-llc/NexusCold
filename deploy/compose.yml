services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - models:/root/.ollama
    # No ports: the unprotected Ollama API stays inside Docker.
    networks: [inference]
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NEXUS_GERMAN_TOKEN: ${NEXUS_GERMAN_TOKEN:?Set a private random token in deploy/.env}
      NEXUS_GERMAN_MODEL: ${NEXUS_GERMAN_MODEL:-qwen3.5:4b}
      OLLAMA_UPSTREAM: http://ollama:11434
    depends_on: [ollama]
    networks: [inference, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      GERMAN_DOMAIN: ${GERMAN_DOMAIN:?Set the actual domain in deploy/.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    networks: [edge]
networks:
  inference:
  edge:
volumes:
  models:
  caddy_data:
  caddy_config:
